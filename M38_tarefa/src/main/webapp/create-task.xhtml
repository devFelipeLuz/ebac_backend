<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Cadastro de Nova Tarefa</title>
</h:head>

<h:body>
    <h:form id="taskCreateForm">

        <h:messages globalOnly="true" style="color: red; font-weight: bold;"/>

        <h2>✍️ Cadastrar Nova Tarefa</h2>

        <h:panelGrid columns="3" cellpadding="5">

            <h:outputLabel value="Nome:" for="nameInput"/>
            <h:inputText id="nameInput"
                         value="#{taskBean.currentTask.name}"
                         required="true"
                         requiredMessage="O campo Nome é obrigatório."
                         maxlength="100"/>
            <h:message for="nameInput" style="color: red;"/>

            <h:outputLabel value="Descrição:" for="descriptionInput"/>
            <h:inputTextarea id="descriptionInput"
                             value="#{taskBean.currentTask.description}"
                             required="true"
                             requiredMessage="O campo Descrição é obrigatório."
                             cols="40" rows="5"/>
            <h:message for="descriptionInput" style="color: red;"/>

        </h:panelGrid>

        <br/>

        <h:commandButton value="Salvar Tarefa" action="#{taskBean.save}" styleClass="btn-primary"/>

        <h:commandButton value="Voltar para Lista" action="tasks.xhtml?faces-redirect=true" immediate="true" styleClass="btn-secondary"/>

    </h:form>
</h:body>
</html>
