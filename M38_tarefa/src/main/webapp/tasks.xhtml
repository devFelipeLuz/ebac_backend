<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Lista de Tarefas</title>
</h:head>

<h:body>
    <h:form id="tasksForm">

        <h2>📋 Lista de Tarefas Cadastradas</h2>

        <h:dataTable value="#{taskBean.tasks}" var="task" styleClass="data-table" headerClass="table-header" rowClasses="table-row">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{task.id}" />
            </h:column>

            <h:column>
                <f:facet name="header">Nome</f:facet>
                <h:outputText value="#{task.name}" />
            </h:column>

            <h:column>
                <f:facet name="header">Descrição</f:facet>
                <h:outputText value="#{task.description}" />
            </h:column>

            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="#{task.status}" style="#{task.status eq 'PENDENTE' ? 'color: red;' : 'color: green; font-weight: bold;'}" />
            </h:column>

            <h:column>
                <f:facet name="header">Ações</f:facet>

                <h:commandButton value="Finalizar" action="#{taskBean.finalizeTask(task)}"
                                 rendered="#{task.status eq 'PENDENTE'}"
                                 styleClass="btn-action">
                </h:commandButton>

                <h:commandButton value="Remover" action="#{taskBean.remove(task)}"
                                 styleClass="btn-action-delete"
                                 onclick="return confirm('Tem certeza que deseja remover esta tarefa?');" />
            </h:column>

        </h:dataTable>

        <br/>

        <h:outputLink value="create-task.xhtml">
            <h:outputText value="➕ Cadastrar Nova Tarefa" />
        </h:outputLink>

    </h:form>
</h:body>
</html>
